name: Experimental graph migration

on:
  pull_request:
    paths:
      - 'java/**'
      - 'dotnet/DocumentSource/**'
      - 'src/**/graphMigration/**'
      - 'src/webviews/cosmosdb/GraphMigration/**'
      - 'scripts/*graph*'
      - 'scripts/*document*'
      - 'schemas/graph-migration/**'
      - 'skills/cosmosdb-graph-migration/**'
      - '.github/workflows/graph-migration.yml'
  workflow_dispatch:
    inputs:
      reference:
        description: Private reference acceptance run
        type: choice
        options: [none, load, soak]
        default: none
      live_compatibility:
        description: Opt in to read-only configured source compatibility (protected environment)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GRAPH_TEST_APPROVAL_KEY: synthetic-test-only-key-not-a-live-credential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - run: npm run graph:test
      - run: node scripts/prepare-graph-worker.mjs
      - run: node scripts/smoke-graph-worker.mjs
      - run: node node_modules/vitest/vitest.mjs run GraphMigrationTab.test.ts GraphMigrationWorkbench.test.tsx WorkerBridge.test.ts artifacts.test.ts contracts.test.ts performance.test.ts
      - run: node scripts/run-reference-graph-benchmark.mjs smoke
      - run: node scripts/benchmark-graph-paths.mjs --private-fixture-confirmed
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.403'
      - name: Locked document SDK and actual offline SDK feed fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet restore dotnet/DocumentSource/DocumentSource.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build dotnet/DocumentSource/DocumentSource.csproj --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dotnet/DocumentSource/bin/Debug/net10.0/win-x64/DocumentSource.exe self-test
          exit $LASTEXITCODE
      - name: Preserve private offline acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: graph-offline-${{ matrix.os }}
          path: |
            java/**/target/surefire-reports/
            java/graph-testkit/target/reference-smoke-*/execution.json
            java/graph-testkit/target/reference-smoke-*/output/report.json
          if-no-files-found: error

  reference:
    if: github.event_name == 'workflow_dispatch' && inputs.reference != 'none'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - run: node scripts/prepare-graph-worker.mjs
      - name: Execute explicitly selected private reference gate
        env:
          REFERENCE_MODE: ${{ inputs.reference }}
        run: node scripts/run-reference-graph-benchmark.mjs "$REFERENCE_MODE"
        shell: bash
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: graph-reference
          path: |
            java/graph-testkit/target/reference-*/execution.json
            java/graph-testkit/target/reference-*/output/report.json
          if-no-files-found: error

  dependency-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - name: Generate Java SBOM and license inventory
        run: java/mvnw -f java/pom.xml -Preports -DskipTests verify -q
      - name: Collect vulnerability observations without authorizing release
        run: node scripts/audit-graph-release.mjs
      - name: Preserve dependency-review blockers and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: graph-dependency-evidence
          path: docs/graph-migration/release/
          if-no-files-found: error
      - name: Enforce explicit dependency release gate
        run: node -e "const r=require('./docs/graph-migration/release/dependency-report.json'); if(r.status!=='succeeded') { console.error('Dependency release gate blocked; inspect collected reports.'); process.exit(2); }"

  live-source-compatibility:
    if: github.event_name == 'workflow_dispatch' && inputs.live_compatibility
    environment: graph-live-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Build isolated read-only adapter
        run: java/mvnw -f java/pom.xml -pl cosmos-gremlin-source -am -DskipTests package -q
      - name: Read-only protected source compatibility
        env:
          GRAPH_SOURCE_KEY: ${{ secrets.GRAPH_SOURCE_KEY }}
          GRAPH_LIVE_PROJECT: ${{ vars.GRAPH_LIVE_PROJECT }}
          GRAPH_LIVE_IDENTITIES: ${{ vars.GRAPH_LIVE_IDENTITIES }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GRAPH_SOURCE_KEY" ] || [ -z "$GRAPH_LIVE_PROJECT" ] || [ -z "$GRAPH_LIVE_IDENTITIES" ]; then
            printf '%s\n' '{"status":"blocked","code":"LIVE_CONFIGURATION_NOT_SUPPLIED"}'
            exit 2
          fi
          mkdir -m 700 live-private
          printf '%s' "$GRAPH_LIVE_PROJECT" > live-private/project.json
          printf '%s' "$GRAPH_LIVE_IDENTITIES" > live-private/identities.ndjson
          java -Xmx256m -jar java/cosmos-gremlin-source/target/cosmos-gremlin-source-0.1.0.jar \
            probe live-private/project.json live-private/identities.ndjson live-private/probe.json \
            > live-private/sensitive-acknowledgement.json
          printf '%s\n' 'Read-only probe completed; sensitive evidence is deliberately not uploaded or published.'
